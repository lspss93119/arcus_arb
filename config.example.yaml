# arcus-arb Phase A configuration / Phase A 配置
#
# This file configures reusable analysis/recording settings. Record-only needs
# no credentials. Phase B0 uses only the explicitly gated tiny-live path; its
# fixed safety envelope is in code and is not enabled by these YAML values.

strategy:
  name: stable_basis
  params:
    # Informational fallback only; do not treat this as a tuned Arcus center.
    center_bps: 0.0
    center_mode: rolling
    center_window_hours: 12
    center_update_minutes: 60
    upper_bps: 4.0
    lower_bps: 4.0

arcus:
  # Reserved compatibility value; B0 resolves Arcus fees from the live fee
  # table/account stream and does not use this field for maker fees.
  taker_fee_bps: 0.0
  max_position_usd: 1000.0
  max_orders_per_min: 0

hedge:
  # Set this to a verified current Lighter-RH taker fee before any approved
  # B0 first order. It is a modeled input, not an Arcus credential.
  taker_fee_bps: 0.0
  max_position_usd: 1000.0
  max_orders_per_min: 30

sizing:
  take_fraction: 0.5
  max_order_notional_usd: 500.0
  min_order_notional_usd: 10.0

inventory:
  scale_bps: 10.0
  floor_frac: 0.5

execution:
  premium_persist_sec: 0.3
  cooldown_sec: 0.0
  settle_timeout_sec: 5.0
  leg_slippage_bps: 50.0
  hedge_slippage_bps: 20.0
  net_tolerance_base: 0.001
  max_consecutive_errors: 3
  rate_limit_pause_sec: 10.0
  staleness_sec: 10.0
  reconcile_sec: 15.0
  venue_probe_sec: 30.0
  http_keepalive_sec: 10.0

recorder:
  enabled: true
  database: data/market-history.sqlite

logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log
